[build-system]
requires = ["setuptools>=65", "wheel", "wget", "os", "sys", "shutil"]
build-backend = "setuptools.build_meta"

[project]
name = "databricks-helpers"
version = "0.2.0"
description = "Small helper utilities for Databricks notebooks"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

authors = [
    { name = "data-derp" }
]

dependencies = []

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
